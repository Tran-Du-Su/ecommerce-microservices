server:
  port: 8081

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:h2:mem:productdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update # auto create table from Entity (only use when dev)
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true # Display UI to view DB on console/h2-console
