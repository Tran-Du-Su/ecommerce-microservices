# Local infrastructure for development. Application services still run from the IDE / mvnw.
services:
  kafka:
    # Same 4.2 line as the kafka-clients pulled in by Spring Boot 4.1. Kafka 4 runs in KRaft mode only:
    # there is no ZooKeeper service, unlike most older tutorials.
    image: apache/kafka:4.2.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # Single node acting as both broker and controller (fine for dev; production separates
      # 3 controllers and >= 3 brokers).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Only one broker, so internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics must be declared explicitly (NewTopic beans): a typo in a topic name would otherwise
      # silently create a new, non-compacted topic with default settings.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
